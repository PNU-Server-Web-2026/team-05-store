# Локальне оточення для розробки.
# Запуск БД:          docker compose up -d db
# БД + pgAdmin:       docker compose --profile tools up -d
# Зупинка:            docker compose --profile tools down        (дані зберігаються у volume)
# Скинути БД:         docker compose --profile tools down -v    (УВАГА: видаляє всі дані)
#
# Паролі POSTGRES_PASSWORD і PGADMIN_DEFAULT_PASSWORD — лише з .env
# (скопіюйте .env.example -> .env). Без них Compose зупиниться з помилкою.

services:
  db:
    image: postgres:17-alpine
    container_name: online_store_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: online_store_pgadmin
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data:
