# Локальне оточення для розробки.
# Запуск БД:   docker compose up -d db
# Зупинка:     docker compose down        (дані зберігаються у volume)
# Скинути БД:  docker compose down -v     (УВАГА: видаляє всі дані)
#
# Значення змінних беруться з файлу .env (скопіюйте .env.example -> .env),
# а якщо .env немає — використовуються значення за замовчуванням нижче.

services:
  db:
    image: postgres:17-alpine
    container_name: online_store_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
